services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cestas_da_mel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cestas_da_mel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cestas_da_mel"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cestas_da_mel_data:
