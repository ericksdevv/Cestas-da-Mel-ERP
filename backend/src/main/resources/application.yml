spring:
  application:
    name: cestas-da-mel-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cestas_da_mel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
app:
  business-zone: ${BUSINESS_TIMEZONE:America/Fortaleza}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
