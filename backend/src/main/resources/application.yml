spring:
  application:
    name: cestas-da-mel-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cestas_da_mel}
    username: ${DB_USERNAME:cestas_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 6MB
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  business-zone: ${BUSINESS_TIMEZONE:America/Fortaleza}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://localhost:5173}
